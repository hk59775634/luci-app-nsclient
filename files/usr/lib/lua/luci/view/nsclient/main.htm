<%#
	luci-app-nsclient — account/password + regional WireGuard exit
-%>
<%+header%>

<style type="text/css">
	/* Fallback when Next Router OS tokens are absent. */
	#nsclient-app { max-width: 960px; }
	#nsclient-app .nsc-status {
		margin: 0 0 1em;
		padding: .85em 1em 1em;
		border-radius: 10px;
		background: var(--nros-surface, #f6f6f6);
		border: 1px solid var(--nros-border, #e5e5e5);
		border-left: 4px solid #999;
	}
	#nsclient-app .nsc-ok { border-left-color: var(--nros-success, #46a546); background: var(--nros-success-soft, #f3faf3); }
	#nsclient-app .nsc-wait { border-left-color: var(--nros-warning, #f89406); background: var(--nros-warning-soft, #fff8ee); }
	#nsclient-app .nsc-off { border-left-color: var(--nros-neutral, #999); }
	#nsclient-app .nsc-err { border-left-color: var(--nros-danger, #c00); background: var(--nros-danger-soft, #fff5f5); }
	#nsclient-app .nsc-state { font-size: 1.15em; font-weight: 600; margin: 0 0 .7em; }
	#nsclient-app .nsc-rows {
		display: grid;
		grid-template-columns: 5.5em 1fr;
		gap: .4em .9em;
		align-items: baseline;
		font-size: 90%;
		color: var(--nros-text, #333);
	}
	#nsclient-app .nsc-k { color: var(--nros-text-3, #888); }
	#nsclient-app .nsc-msg { margin: .2em 0 1em; min-height: 1.2em; color: var(--nros-text-2, #555); }
	#nsclient-app .nsc-msg--ok { color: var(--nros-success, #2a2); }
	#nsclient-app .nsc-msg--err { color: var(--nros-danger, #c00); }
	#nsclient-app .nsc-actions { display: flex; flex-wrap: wrap; gap: .5em; margin-top: .8em; }
	#nsclient-app .nsc-meta,
	#nsclient-app .nsc-hint { color: var(--nros-text-3, #888); font-size: 85%; }
	#nsclient-app .nsc-hint { margin-top: 4px; }
	#nsclient-app .nsc-toggle {
		display: flex;
		align-items: flex-start;
		gap: 12px;
		padding: 10px 0;
		border-bottom: 1px solid var(--nros-border, #eee);
	}
	#nsclient-app .nsc-toggle:last-of-type { border-bottom: 0; }
	#nsclient-app .nsc-toggle__label { font-weight: 500; }
	#nsclient-app .nsc-exits { list-style: none; margin: .2em 0 .6em; padding: 0; }
	#nsclient-app .nsc-exits li {
		display: flex;
		align-items: center;
		gap: .6em;
		padding: .55em .7em;
		margin: 0 0 .4em;
		border: 1px solid var(--nros-border, #e5e5e5);
		border-radius: 8px;
		background: var(--nros-surface, #fff);
		cursor: pointer;
	}
	#nsclient-app .nsc-exits li:hover { background: var(--nros-surface-2, #f7f7f7); }
	#nsclient-app .nsc-exits li.nsc-on { background: var(--nros-primary-soft, #eef7ee); border-color: transparent; }
	#nsclient-app .nsc-exits .nsc-name { flex: 1; }
	#nsclient-app .nsc-badge {
		display: inline-block;
		padding: .05em .5em;
		border-radius: 6px;
		font-size: 85%;
		background: var(--nros-success, #46a546);
		color: #fff;
	}
	#nsclient-app .nsc-badge-wait { background: var(--nros-warning, #f89406); }
	#nsclient-app input[disabled] { opacity: .55; cursor: not-allowed; }
	#nsclient-app input.nros-btn { width: auto; appearance: none; -webkit-appearance: none; border: 1px solid transparent; }
	#nsclient-app input.nros-btn.nros-btn--primary {
		background: var(--nros-primary, #0F6E6B);
		color: var(--nros-primary-fg, #fff);
		border-color: transparent;
	}
	#nsclient-app .nsc-step-label { margin-top: 2px; font-size: 12px; font-weight: 500; color: var(--nros-text-3, #6B7280); }
	#nsclient-app .nsc-actions--hd { margin: 0; }
	#nsclient-app .nsc-tour-target { position: relative; z-index: 5; box-shadow: 0 0 0 3px var(--nros-primary, #0F6E6B); }
	#nsc-tour[hidden] { display: none !important; }
	#nsc-tour { position: fixed; inset: 0; z-index: 80; pointer-events: none; }
	#nsc-tour-pop {
		position: fixed; z-index: 83; width: min(360px, calc(100vw - 32px));
		padding: 16px 16px 14px; border-radius: 10px;
		background: var(--nros-elevated, #fff); border: 1px solid var(--nros-border, #e5e7eb);
		box-shadow: 0 12px 32px rgba(17,24,39,.12); pointer-events: auto;
	}
	#nsc-tour-pop .nsc-tour-kicker { font-size: 11px; font-weight: 600; color: var(--nros-primary, #0F6E6B); margin-bottom: 4px; }
	#nsc-tour-pop .nsc-tour-title { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
	#nsc-tour-pop .nsc-tour-body { margin: 0 0 14px; font-size: 13px; color: var(--nros-text-2, #4B5563); line-height: 1.55; }
	#nsc-tour-pop .nsc-tour-nav { display: flex; justify-content: flex-end; gap: 8px; }
</style>

<div id="nsclient-app">
	<div class="nros-page-head">
		<div>
			<h1 class="nros-title" name="content">VPN</h1>
			<p class="nros-subtitle">先登录账号，再选择出口连接。分流：国内走本地网络，海外走隧道。全局：全部公网走隧道。</p>
		</div>
		<input type="button" class="nros-btn" id="nsc-guide-start" value="使用引导" />
	</div>

	<div id="nsc-status" class="nsc-status nsc-off">正在读取状态…</div>
	<div id="nsc-msg" class="nsc-msg"></div>

	<div class="nros-grid nros-grid--2">
		<section class="nros-card" id="nsc-card-account">
			<div class="nros-card__hd">
				<div>
					<div class="nros-section-title">账号</div>
					<div class="nsc-step-label">第 1 步 · 登录账号</div>
				</div>
			</div>
			<div class="nros-card__bd">
				<div class="nros-field">
					<label for="nsc-account">账号</label>
					<input class="nros-input" type="text" id="nsc-account" autocomplete="username" />
				</div>
				<div class="nros-field">
					<label for="nsc-password">密码</label>
					<input class="nros-input" type="password" id="nsc-password" autocomplete="current-password" />
					<span class="nsc-hint">已保存过则可留空</span>
				</div>
				<div class="nsc-actions">
					<input type="button" class="nros-btn nros-btn--primary" id="nsc-login" value="登录" />
				</div>
				<div class="nsc-toggle">
					<label class="nros-switch">
						<input type="checkbox" id="nsc-enable" />
						<span></span>
					</label>
					<div>
						<div class="nsc-toggle__label">开机连接</div>
						<div class="nsc-hint">未选出口时：只有一个就用它，多个则默认第一个</div>
					</div>
				</div>
				<div class="nsc-toggle">
					<label class="nros-switch">
						<input type="checkbox" id="nsc-split" checked="checked" />
						<span></span>
					</label>
					<div>
						<div class="nsc-toggle__label">分流模式</div>
						<div class="nsc-hint">国内网站直连，海外走隧道（chnroutes）</div>
					</div>
				</div>
			</div>
		</section>

		<section class="nros-card" id="nsc-card-exits">
			<div class="nros-card__hd">
				<div>
					<div class="nros-section-title">可用出口</div>
					<div class="nsc-step-label">第 2 步 · 选择出口并连接</div>
				</div>
			</div>
			<div class="nros-card__bd">
				<div id="nsc-empty" class="nsc-meta">正在获取可用出口…</div>
				<ul class="nsc-exits" id="nsc-list" style="display:none"></ul>
				<div class="nsc-actions">
					<input type="button" class="nros-btn nros-btn--primary" id="nsc-connect" value="连接" />
					<input type="button" class="nros-btn" id="nsc-disconnect" value="断开" />
				</div>
			</div>
		</section>
	</div>
</div>

<div id="nsc-tour" hidden>
	<div id="nsc-tour-pop" role="dialog" aria-modal="true" aria-labelledby="nsc-tour-title">
		<div class="nsc-tour-kicker" id="nsc-tour-kicker"></div>
		<div class="nsc-tour-title" id="nsc-tour-title"></div>
		<p class="nsc-tour-body" id="nsc-tour-body"></p>
		<div class="nsc-tour-nav">
			<input type="button" class="nros-btn" id="nsc-tour-skip" value="跳过" />
			<input type="button" class="nros-btn nros-btn--primary" id="nsc-tour-next" value="下一步" />
		</div>
	</div>
</div>

<script type="text/javascript">//<![CDATA[
(function() {
	var U_STATUS = '<%=luci.dispatcher.build_url("admin", "nsclient", "status")%>';
	var U_LOGIN = '<%=luci.dispatcher.build_url("admin", "nsclient", "login")%>';
	var U_CONNECT = '<%=luci.dispatcher.build_url("admin", "nsclient", "connect")%>';
	var U_DISCONNECT = '<%=luci.dispatcher.build_url("admin", "nsclient", "disconnect")%>';
	var U_SAVE = '<%=luci.dispatcher.build_url("admin", "nsclient", "save")%>';
	var TOKEN = '<%=token%>';
	var CACHED = <% luci.http.write(status_cache_json or "{}") %>;

	var REGIONS = {
		hk: '香港', us: '美国', sg: '新加坡', jp: '日本',
		tw: '台湾', uk: '英国', de: '德国', kr: '韩国',
		au: '澳洲', in: '印度'
	};

	var lastStatus = null;
	var lastNodes = [];
	var busy = false;
	var switchingTo = null;
	var accountFilled = false;
	var accountSyncing = false;
	var accountSynced = false;
	var GUIDE_KEY = 'nros-vpn-guide';
	var GUIDE_STEPS = [
		{
			target: 'nsc-card-account',
			kicker: '两步连接  1 / 2',
			title: '先登录账号',
			body: '填写账号和密码，点「登录」。登录成功后，右侧才会出现可用出口。已保存过密码则可留空。'
		},
		{
			target: 'nsc-card-exits',
			kicker: '两步连接  2 / 2',
			title: '再选择出口并连接',
			body: '在列表中点选一个出口，再点下方「连接」。也可以直接打开「开机连接」：只有一个出口就用它，多个则默认第一个。'
		}
	];
	var guideStep = -1;
	var guideOn = false;

	function $(id) { return document.getElementById(id); }

	function regionLabel(code) {
		if (!code) return '';
		return REGIONS[code] || String(code).toUpperCase();
	}

	function displayAccount(s) {
		s = String(s || '');
		var i = s.indexOf('/');
		return i >= 0 ? s.substring(0, i) : s;
	}

	function bytes(n) {
		n = parseFloat(n) || 0;
		if (n < 1024) return Math.round(n) + ' B';
		var u = ['KiB', 'MiB', 'GiB', 'TiB'], i = 0;
		n /= 1024;
		while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
		return n.toFixed(1) + ' ' + u[i];
	}

	function setMsg(text, isErr) {
		var el = $('nsc-msg');
		el.textContent = text || '';
		el.className = 'nsc-msg' + (text ? (isErr ? ' nsc-msg--err' : ' nsc-msg--ok') : '');
	}

	function selectedRegion() {
		var radios = document.getElementsByName('nsc-region');
		for (var i = 0; i < radios.length; i++) {
			if (radios[i].checked) return radios[i].value;
		}
		return '';
	}

	function selectRegion(code) {
		if (!code) return '';
		var radios = document.getElementsByName('nsc-region');
		for (var i = 0; i < radios.length; i++) {
			if (radios[i].value === code) {
				radios[i].checked = true;
				return code;
			}
		}
		return '';
	}

	function pickDefaultRegion() {
		var sel = selectedRegion();
		if (sel) return sel;
		var st = lastStatus || {};
		var nodes = st.nodes || lastNodes || [];
		var want = st.live_region || st.region || '';
		if (want && selectRegion(want))
			return want;
		if (nodes.length && nodes[0].region) {
			selectRegion(nodes[0].region);
			return nodes[0].region;
		}
		return selectedRegion();
	}

	function needsAccountInfo(st) {
		st = st || lastStatus || {};
		var nodes = st.nodes || [];
		return !nodes.length || !st.expired_text;
	}

	function updateButtons() {
		var st = lastStatus || {};
		var region = pickDefaultRegion();
		var connBtn = $('nsc-connect');
		var discBtn = $('nsc-disconnect');
		if (busy) return;
		$('nsc-login').disabled = false;
		discBtn.disabled = !st.connected;
		if (!region) {
			connBtn.disabled = true;
			connBtn.value = '连接';
			return;
		}
		connBtn.disabled = false;
		if (st.connected && st.region === region)
			connBtn.value = '重新连接';
		else if (st.connected)
			connBtn.value = '切换到' + regionLabel(region);
		else
			connBtn.value = '连接';
	}

	function renderNodes(nodes, region, st) {
		nodes = nodes || [];
		lastNodes = nodes;
		st = st || lastStatus || {};
		var list = $('nsc-list');
		var empty = $('nsc-empty');
		list.innerHTML = '';
		if (!nodes.length) {
			list.style.display = 'none';
			empty.style.display = '';
			empty.textContent = accountSyncing ? '正在获取可用出口…' : '暂无可用出口，请先登录。';
			updateButtons();
			return;
		}
		empty.style.display = 'none';
		list.style.display = '';
		if (!region) region = st.live_region || st.region || nodes[0].region;
		for (var i = 0; i < nodes.length; i++) {
			var n = nodes[i];
			var live = st.live_region || (st.connected ? st.region : '');
			var on = !!(st.connected && n.region === live && !switchingTo);
			var wait = !!(st.connected && n.region === live && !st.handshake);
			var swapping = !!(switchingTo && n.region === switchingTo);
			var li = document.createElement('li');
			if (on || swapping) li.className = 'nsc-on';
			var badge = '';
			if (swapping) badge = '<span class="nsc-badge nsc-badge-wait">切换中</span>';
			else if (on && wait) badge = '<span class="nsc-badge nsc-badge-wait">握手中</span>';
			else if (on) badge = '<span class="nsc-badge">当前</span>';
			li.innerHTML =
				'<input type="radio" name="nsc-region" value="' + (n.region || '') + '"' +
				((n.region === region) ? ' checked="checked"' : '') + ' />' +
				'<span class="nsc-name">' + regionLabel(n.region) + '</span>' +
				badge;
			(function(row) {
				row.onclick = function(ev) {
					if (ev.target && ev.target.tagName === 'INPUT') {
						updateButtons();
						return;
					}
					var r = row.getElementsByTagName('input')[0];
					if (r) r.checked = true;
					updateButtons();
				};
			})(li);
			list.appendChild(li);
		}
		updateButtons();
	}

	function displayExitIp(st) {
		if (switchingTo) return '获取中…';
		if (!st || !st.connected) return '';
		var live = st.live_region || '';
		if (!st.exit_ip) return '获取中…';
		if (live && st.exit_ip_region && st.exit_ip_region !== live) return '获取中…';
		return st.exit_ip;
	}

	function row(k, v) {
		if (!v) return '';
		return '<span class="nsc-k">' + k + '</span><span>' + v + '</span>';
	}

	function renderStatus(st) {
		if (!st) return;
		lastStatus = st;
		var box = $('nsc-status');
		var state, cls;
		var live = st.live_region || st.region || '';
		if (switchingTo) {
			state = '正在切换到' + regionLabel(switchingTo);
			cls = 'nsc-wait';
		} else if (st.connected && st.handshake) {
			state = '已连接';
			cls = 'nsc-ok';
		} else if (st.connected) {
			state = '连接中，等待握手';
			cls = 'nsc-wait';
		} else if (st.block_reason) {
			state = st.block_reason;
			cls = 'nsc-err';
		} else {
			state = '未连接';
			cls = 'nsc-off';
		}

		var acc = displayAccount(st.login_account || st.account || '');
		var traffic = '';
		if (st.connected && !switchingTo)
			traffic = '↓ ' + bytes(st.rx) + '　↑ ' + bytes(st.tx);

		box.className = 'nsc-status ' + cls;
		box.innerHTML = '<div class="nsc-state">' + state + '</div><div class="nsc-rows">' +
			row('账号', acc) +
			row('区域', regionLabel(switchingTo || live)) +
			row('模式', st.split ? '分流（国内直连）' : '全局') +
			row('出口 IP', displayExitIp(st)) +
			row('到期', st.expired_text || (accountSyncing ? '获取中…' : '')) +
			row('流量', traffic) +
			'</div>';

		if (!accountFilled && acc) {
			$('nsc-account').value = acc;
			accountFilled = true;
		}
		$('nsc-enable').checked = !!st.enable;
		if ($('nsc-split')) $('nsc-split').checked = st.split !== 0 && st.split !== false;
		renderNodes(st.nodes, selectedRegion() || st.region, st);
	}

	function scrub(s) {
		s = String(s == null ? '' : s);
		s = s.replace(/[\u0000-\u001F\u007F\u200B-\u200F\uFEFF]/g, '');
		s = s.replace(/[\u00A0\u3000]/g, ' ');
		s = s.replace(/^[ \t]+|[ \t]+$/g, '');
		s = s.replace(/^[\"'`<]+/, '').replace(/[\"'`>]+$/, '');
		return s.replace(/^[ \t]+|[ \t]+$/g, '');
	}

	function scrubAccount(s) { return scrub(s); }

	function scrubRegion(s) {
		return scrub(s).replace(/\s+/g, '').toLowerCase();
	}

	function bindClean(id, kind) {
		var el = $(id);
		if (!el) return;
		var clean = function() {
			var v = kind === 'account' ? scrubAccount(el.value) : scrub(el.value);
			if (el.value !== v) el.value = v;
		};
		el.addEventListener('blur', clean);
		el.addEventListener('paste', function() { setTimeout(clean, 0); });
	}

	function post(url, fields, cb) {
		var data = { token: TOKEN };
		for (var k in fields) data[k] = fields[k];
		new XHR().post(url, data, function(x, json) {
			cb(json || {}, x);
		});
	}

	function collect() {
		return {
			account: scrubAccount($('nsc-account').value),
			password: scrub($('nsc-password').value),
			enable: $('nsc-enable').checked ? '1' : '0',
			split: ($('nsc-split') && $('nsc-split').checked) ? '1' : '0',
			region: scrubRegion(pickDefaultRegion())
		};
	}

	function refreshStatus(cb) {
		new XHR().get(U_STATUS, null, function(x, st) {
			renderStatus(st);
			if (cb) cb(st);
		});
	}

	function syncAccountInfo() {
		if (accountSynced || accountSyncing || busy) return;
		if (!needsAccountInfo()) {
			accountSynced = true;
			return;
		}
		accountSyncing = true;
		renderNodes(lastNodes, selectedRegion(), lastStatus);
		if (lastStatus) renderStatus(lastStatus);
		post(U_LOGIN, collect(), function(j) {
			if (j && (j.pending || j.ok)) {
				waitUntilLogin(collect().account, 0, function(ok, st, msg) {
					accountSyncing = false;
					accountSynced = true;
					if (ok) {
						if (st && st.nodes && st.nodes.length)
							renderNodes(st.nodes, selectedRegion() || st.nodes[0].region, st);
						refreshStatus();
					} else {
						$('nsc-empty').textContent = msg || '无法获取出口列表，请检查账号后重新登录。';
						if (msg) setMsg(msg, true);
						refreshStatus();
					}
				});
				return;
			}
			accountSyncing = false;
			accountSynced = true;
			$('nsc-empty').textContent = (j && j.msg) || '无法获取出口列表，请检查账号后重新登录。';
			if (j && j.msg) setMsg(j.msg, true);
			refreshStatus();
		});
	}

	bindClean('nsc-account', 'account');
	bindClean('nsc-password', 'password');

	function withBusy(btn, work) {
		if (busy) return;
		busy = true;
		var btns = [$('nsc-login'), $('nsc-connect'), $('nsc-disconnect')];
		var old = [];
		for (var i = 0; i < btns.length; i++) {
			old[i] = btns[i].value;
			btns[i].disabled = true;
		}
		if (btn) btn.value = switchingTo ? '切换中…' : '处理中…';
		work(function() {
			busy = false;
			for (var j = 0; j < btns.length; j++) {
				btns[j].disabled = false;
				btns[j].value = old[j];
			}
			updateButtons();
		});
	}

	function waitUntilLogin(account, n, done, needUp) {
		n = n || 0;
		var want = displayAccount(account);
		refreshStatus(function(st) {
			var pending = !!(st && st.login_pending);
			var res = st && st.login_result;
			var live = displayAccount((st && st.login_account) || '');
			if (pending) {
				if (n >= 60) {
					done(false, st, '登录超时，请稍后重试');
					return;
				}
				setTimeout(function() { waitUntilLogin(account, n + 1, done, needUp); }, 1000);
				return;
			}
			if (res && res.ok === false) {
				done(false, st, res.msg || '登录失败');
				return;
			}
			if (res && res.ok) {
				var got = displayAccount(res.account || live);
				if (!want || got === want) {
					if (st && st.nodes && st.nodes.length) {
						if (needUp && !(st.connected && live === want)) {
							if (n >= 60) {
								done(true, st, '登录成功，请再点连接');
								return;
							}
							setTimeout(function() { waitUntilLogin(account, n + 1, done, needUp); }, 1000);
							return;
						}
						done(true, st, needUp ? '已切换到新账号' : (res.msg || '登录成功'));
						return;
					}
				}
			}
			if (n >= 2 && st && st.block_reason) {
				done(false, st, st.block_reason);
				return;
			}
			if (n >= 60) {
				done(false, st, '登录超时，请稍后重试');
				return;
			}
			setTimeout(function() { waitUntilLogin(account, n + 1, done, needUp); }, 1000);
		});
	}

	$('nsc-login').onclick = function() {
		var btn = this;
		var acc = scrubAccount($('nsc-account').value);
		var pw = scrub($('nsc-password').value);
		if (!acc) { setMsg('请填写账号', true); return; }
		var prev = displayAccount((lastStatus && lastStatus.login_account) || (lastStatus && lastStatus.account) || '');
		if (prev && acc !== prev && !pw) {
			setMsg('更换账号请填写密码', true);
			return;
		}
		var needUp = !!(lastStatus && (lastStatus.connected || lastStatus.want));
		withBusy(btn, function(done) {
			accountSynced = false;
			setMsg(needUp ? '正在切换账号并连接…' : '正在登录…');
			post(U_LOGIN, collect(), function(j) {
				if (j && j.ok === false && !j.pending) {
					setMsg((j && j.msg) || '登录失败', true);
					done();
					return;
				}
				waitUntilLogin(acc, 0, function(ok, st, msg) {
					accountSynced = true;
					if (ok) {
						setMsg(msg || '登录成功');
						if (st && st.nodes && st.nodes.length)
							renderNodes(st.nodes, selectedRegion() || st.live_region || st.nodes[0].region, st);
						if (guideOn && guideStep === 0)
							showGuideStep(1);
					} else {
						setMsg(msg || '登录失败', true);
					}
					refreshStatus();
					done();
				}, needUp);
			});
		});
	};

	function onTarget(st, region, fromIp) {
		if (!st || !st.connected || !region) return false;
		if (st.live_region) return st.live_region === region;
		if (fromIp && st.private_ip === fromIp) return false;
		return !!st.private_ip;
	}

	function waitUntilRegion(region, fromIp, op, n, done) {
		n = n || 0;
		if (op.cancelled) return;
		refreshStatus(function(st) {
			if (op.cancelled) return;
			if (onTarget(st, region, fromIp)) {
				setMsg('已连接到' + regionLabel(region));
				done(true);
				return;
			}
			if (n >= 2 && st && st.block_reason && !st.connected) {
				setMsg(st.block_reason, true);
				done(false);
				return;
			}
			if (n >= 24) {
				setMsg('切换超时，请稍后重试', true);
				done(false);
				return;
			}
			setTimeout(function() { waitUntilRegion(region, fromIp, op, n + 1, done); }, 1000);
		});
	}

	$('nsc-connect').onclick = function() {
		var btn = this;
		var region = pickDefaultRegion();
		if (!region) { setMsg('暂无可用出口，请先登录', true); return; }
		var from = (lastStatus && (lastStatus.live_region || lastStatus.region)) || '';
		var fromIp = (lastStatus && lastStatus.private_ip) || '';
		var switching = !!(from && from !== region);
		switchingTo = region;
		withBusy(btn, function(done) {
			var op = { cancelled: false };
			setMsg((switching ? '正在切换到' : '正在连接 ') + regionLabel(region) + '…');
			if (lastStatus) renderStatus(lastStatus);
			var f = collect();
			f.region = region;
			post(U_CONNECT, f, function(j) {
				if (op.cancelled) return;
				if (j && j.ok === false && j.msg && j.msg !== '无有效响应') {
					op.cancelled = true;
					switchingTo = null;
					setMsg(j.msg, true);
					refreshStatus();
					done();
				}
			});
			waitUntilRegion(region, fromIp, op, 0, function(ok) {
				switchingTo = null;
				refreshStatus();
				done();
				if (ok && guideOn)
					endGuide(true);
			});
		});
	};

	$('nsc-disconnect').onclick = function() {
		var btn = this;
		withBusy(btn, function(done) {
			setMsg('正在断开…');
			post(U_DISCONNECT, { token: TOKEN }, function(j) {
				if (j && j.ok) setMsg(j.msg || '已断开');
				else setMsg((j && j.msg) || '断开失败', true);
				refreshStatus();
				done();
			});
		});
	};

	$('nsc-enable').onchange = function() {
		var on = this.checked;
		var fields = { enable: on ? '1' : '0' };
		var region = '';
		if (on) {
			region = pickDefaultRegion();
			if (region) fields.region = region;
		}
		post(U_SAVE, fields, function(j) {
			if (j && j.ok) {
				var extra = (on && region) ? ('，出口 ' + regionLabel(region)) : '';
				setMsg(on ? ('已开启开机连接' + extra) : '已关闭开机连接');
				updateButtons();
			} else {
				setMsg((j && j.msg) || '保存失败', true);
			}
		});
	};

	$('nsc-split').onchange = function() {
		var on = this.checked;
		setMsg(on ? '正在切换到分流…' : '正在切换到全局…');
		post(U_SAVE, { split: on ? '1' : '0' }, function(j) {
			if (j && j.ok) {
				setMsg(on ? '已开启分流：国内直连，海外走隧道' : '已切换为全局：全部公网走隧道');
				refreshStatus();
			} else {
				setMsg((j && j.msg) || '保存失败', true);
			}
		});
	};

	$('nsc-password').onkeydown = function(ev) {
		ev = ev || window.event;
		if ((ev.keyCode || ev.which) === 13) {
			$('nsc-login').click();
			return false;
		}
	};

	function guideDone() {
		try { return localStorage.getItem(GUIDE_KEY) === 'done'; } catch (e) { return false; }
	}

	function markGuideDone() {
		try { localStorage.setItem(GUIDE_KEY, 'done'); } catch (e) {}
	}

	function clearGuideTarget() {
		var cards = document.querySelectorAll('#nsclient-app .nsc-tour-target');
		for (var i = 0; i < cards.length; i++)
			cards[i].classList.remove('nsc-tour-target');
	}

	function placeTourPop(target) {
		var pop = $('nsc-tour-pop');
		if (!pop || !target) return;
		var r = target.getBoundingClientRect();
		var gap = 12;
		var left = Math.min(Math.max(16, r.left), window.innerWidth - pop.offsetWidth - 16);
		var top = r.bottom + gap;
		if (top + pop.offsetHeight > window.innerHeight - 12)
			top = Math.max(12, r.top - pop.offsetHeight - gap);
		pop.style.left = left + 'px';
		pop.style.top = top + 'px';
	}

	function showGuideStep(n) {
		var step = GUIDE_STEPS[n];
		var root = $('nsc-tour');
		if (!step || !root) return;
		guideOn = true;
		guideStep = n;
		clearGuideTarget();
		var target = $(step.target);
		if (target) {
			target.classList.add('nsc-tour-target');
			try { target.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
		}
		$('nsc-tour-kicker').textContent = step.kicker;
		$('nsc-tour-title').textContent = step.title;
		$('nsc-tour-body').textContent = step.body;
		$('nsc-tour-next').value = (n >= GUIDE_STEPS.length - 1) ? '完成' : '下一步';
		root.hidden = false;
		placeTourPop(target);
		setTimeout(function() { placeTourPop(target); }, 320);
	}

	function endGuide(save) {
		guideOn = false;
		guideStep = -1;
		clearGuideTarget();
		var root = $('nsc-tour');
		if (root) root.hidden = true;
		if (save) markGuideDone();
	}

	function startGuide() {
		showGuideStep(0);
	}

	$('nsc-guide-start').onclick = function() { startGuide(); };
	$('nsc-tour-skip').onclick = function() { endGuide(true); };
	$('nsc-tour-next').onclick = function() {
		if (guideStep >= GUIDE_STEPS.length - 1)
			endGuide(true);
		else
			showGuideStep(guideStep + 1);
	};
	document.addEventListener('keydown', function(ev) {
		if (!guideOn) return;
		if ((ev.key || ev.keyCode) === 'Escape' || ev.keyCode === 27)
			endGuide(true);
	});
	window.addEventListener('resize', function() {
		if (guideOn && GUIDE_STEPS[guideStep])
			placeTourPop($(GUIDE_STEPS[guideStep].target));
	});
	window.addEventListener('scroll', function() {
		if (guideOn && GUIDE_STEPS[guideStep])
			placeTourPop($(GUIDE_STEPS[guideStep].target));
	}, true);

	XHR.poll(5, U_STATUS, null, function(x, st) {
		if (!busy) {
			renderStatus(st);
			if (needsAccountInfo(st)) syncAccountInfo();
		}
	});
	if (CACHED && CACHED.ok) renderStatus(CACHED);
	refreshStatus(function(st) {
		if (needsAccountInfo(st)) syncAccountInfo();
		if (!guideDone() && !(st && st.connected && st.handshake))
			setTimeout(startGuide, 500);
	});
})();
